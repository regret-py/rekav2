# Construit « REKA.exe » sur une machine Windows de GitHub à chaque push,
# après les tests, et le publie dans une release téléchargeable.
name: Build Windows

on:
  push:
    paths:
      - "reaper_mixer/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-linux:
    name: Tests (Linux, pont Lua inclus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reaper_mixer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances système (Qt hors écran, Lua 5.4)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dépendances Python
        run: python -m pip install -r requirements.txt pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

  build-windows:
    name: Tests + build de l'exe (Windows)
    needs: tests-linux
    runs-on: windows-latest
    defaults:
      run:
        working-directory: reaper_mixer
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances Python
        run: python -m pip install -r requirements.txt pytest
      - name: Tests (dont masquage de fenêtres Win32)
        run: python -m pytest -q tests
      - name: Infos du build (mises à jour automatiques)
        run: |
          python - <<'PY'
          import json, os, re
          source = open("core/config.py", encoding="utf-8").read()
          version = re.search(r'^APP_VERSION = "([^"]+)"', source, re.M).group(1)
          branch = os.environ["GITHUB_REF_NAME"].replace("/", "-")
          info = {"version": version, "build": int(os.environ["GITHUB_RUN_NUMBER"]),
                  "commit": os.environ["GITHUB_SHA"], "repo": os.environ["GITHUB_REPOSITORY"],
                  "tag": f"build-{branch}"}
          json.dump(info, open("build_info.json", "w", encoding="utf-8"), indent=2)
          print(info)
          PY
      - name: Build PyInstaller
        run: python -m PyInstaller --noconfirm --clean build.spec
      - name: Propriétés de l'exe (version, développeurs)
        shell: pwsh
        run: |
          $info = (Get-Item dist/REKA.exe).VersionInfo
          $info | Format-List ProductName, ProductVersion, FileDescription, CompanyName, LegalCopyright
          if ($info.CompanyName -ne "Regrettable & Zerka") { throw "Crédits absents de REKA.exe" }
      - name: Auto-test de l'exe (rendu de la console en mode démo)
        env:
          APPDATA: ${{ runner.temp }}/appdata
        run: |
          mkdir -p selftest
          "./dist/REKA.exe" --selftest "$(pwd -W)/selftest/console.png"
          cat selftest/console.txt
          grep -q "RÉSULTAT : OK" selftest/console.txt
          ls -la dist selftest
      - name: Description de la mise à jour (version.json)
        run: |
          python - <<'PY'
          import datetime, hashlib, json, subprocess
          info = json.load(open("build_info.json", encoding="utf-8"))
          data = open("dist/REKA.exe", "rb").read()
          info.update(
              sha256=hashlib.sha256(data).hexdigest(), size=len(data),
              url=f"https://github.com/{info['repo']}/releases/download/{info['tag']}/REKA.exe",
              notes=subprocess.check_output(["git", "log", "-1", "--format=%s"],
                                            encoding="utf-8").strip(),   # git écrit en UTF-8
              published=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"))
          json.dump(info, open("dist/version.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(info, ensure_ascii=False, indent=2))
          PY
      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: REKA
          path: |
            reaper_mixer/dist/REKA.exe
            reaper_mixer/dist/version.json
            reaper_mixer/selftest/
      - name: Release « build-<branche> »
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" dist/REKA.exe dist/version.json selftest/console.png \
            --prerelease --target "$GITHUB_SHA" \
            --title "REKA — dernier build ($GITHUB_REF_NAME)" \
            --notes "Exécutable Windows construit automatiquement depuis $GITHUB_SHA.

          Télécharge **REKA.exe** et lance-le. Il faut Voicemeeter (Potato ou Banana) et REAPER installés.
          REKA est développé par Regrettable et Zerka.
          Pour voir la console sans eux : \`REKA.exe --demo\`.
          console.png : rendu de l'auto-test fait par ce build."
